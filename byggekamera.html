<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }
    .iframe-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 177.78vh; /* 16:9 aspect ratio */
      height: 100vh;
      min-width: 100vw;
      min-height: 56.25vw;
      border: 0;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe src="https://kunde.byggekamera.no/?p=1182&c=1595" scrolling="no"></iframe>
  </div>
</body>
</html>
