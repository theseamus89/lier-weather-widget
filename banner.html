<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lier vei, vann og avløp KF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            width: 1920px;
            height: 100px;
            overflow: hidden;
        }

        .banner {
            display: flex;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
            align-items: center;
        }

        /* Logo Section */
        .logo-section {
            display: flex;
            align-items: center;
            padding: 0 24px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #30363d;
        }

        .kommune-logo {
            height: 45px;
            width: auto;
            flex-shrink: 0;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            white-space: nowrap;
        }

        .company-name {
            font-size: 14px;
            font-weight: 600;
            color: #706F6F;
            letter-spacing: 0.3px;
            line-height: 1.3;
            margin-left: 16px;
        }

        /* News Section */
        .news-section {
            flex: 1;
            display: flex;
            align-items: center;
            height: 100%;
            overflow: hidden;
            position: relative;
            padding-left: 24px;
        }

        .nrk-badge {
            height: 24px;
            margin-right: 20px;
            flex-shrink: 0;
            opacity: 0.9;
        }

        .news-container {
            flex: 1;
            overflow: hidden;
            mask-image: linear-gradient(to right, black 0%, black 95%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 0%, black 95%, transparent 100%);
        }

        .news-ticker {
            display: flex;
            animation: ticker 50s linear infinite;
        }

        .news-item {
            display: flex;
            align-items: center;
            white-space: nowrap;
            padding-right: 80px;
            font-size: 18px;
            color: #c9d1d9;
            font-weight: 400;
        }

        .news-separator {
            width: 4px;
            height: 4px;
            background: #484f58;
            border-radius: 50%;
            margin-right: 80px;
            flex-shrink: 0;
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Clock Section */
        .clock-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            padding: 0 32px;
            height: 100%;
            background: linear-gradient(135deg, #0d1117 0%, #1a1f26 100%);
            border-left: 1px solid #30363d;
        }

        .clock-time {
            font-size: 42px;
            font-weight: 300;
            color: #f0f6fc;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .clock-date {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="logo-section">
            <img class="kommune-logo" src="https://www.lier.kommune.no/globalassets/system-lier-2019/lier-logo.svg" alt="Lier kommune">
            <div class="logo-text">
                <span class="company-name">Lier vei, vann og avløp KF</span>
            </div>
        </div>

        <div class="news-section">
            <img src="nrk-nyheter-logo.png" alt="NRK Nyheter" class="nrk-badge">
            <div class="news-container">
                <div class="news-ticker" id="newsTicker">
                    <span class="news-item">Laster nyheter...</span>
                </div>
            </div>
        </div>

        <div class="clock-section">
            <div class="clock-time" id="clockTime">--:--</div>
            <div class="clock-date" id="clockDate">--</div>
        </div>
    </div>

    <script>
        function updateClock() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            document.getElementById('clockTime').textContent =
                (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;

            var days = ['sondag', 'mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lordag'];
            var months = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];
            document.getElementById('clockDate').textContent =
                days[now.getDay()] + ' ' + now.getDate() + '. ' + months[now.getMonth()];
        }

        updateClock();
        setInterval(updateClock, 1000);

        function fetchNews() {
            var rssUrl = 'https://www.nrk.no/nyheter/siste.rss';
            var proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rssUrl);

            var xhr = new XMLHttpRequest();
            xhr.open('GET', proxyUrl, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var parser = new DOMParser();
                    var xml = parser.parseFromString(xhr.responseText, 'text/xml');
                    var items = xml.querySelectorAll('item');
                    var headlines = [];

                    for (var i = 0; i < Math.min(items.length, 10); i++) {
                        var title = items[i].querySelector('title');
                        if (title) headlines.push(title.textContent);
                    }

                    if (headlines.length > 0) renderNews(headlines);
                }
            };
            xhr.send();
        }

        function renderNews(headlines) {
            var ticker = document.getElementById('newsTicker');
            var html = '';

            for (var r = 0; r < 2; r++) {
                for (var i = 0; i < headlines.length; i++) {
                    html += '<span class="news-item">' + headlines[i] + '</span>';
                }
            }

            ticker.innerHTML = html;

            var width = ticker.scrollWidth / 2;
            ticker.style.animationDuration = (width / 100) + 's';
        }

        fetchNews();
        setInterval(fetchNews, 300000);
    </script>
</body>
</html>
