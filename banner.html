<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVVA KF Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            background: #0a0a0a;
            width: 1920px;
            height: 100px;
            overflow: hidden;
        }

        .banner-container {
            display: flex;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1e3a5f 0%, #0d1b2a 100%);
            align-items: center;
            padding: 0 30px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            width: 280px;
        }

        .logo-section svg {
            width: 60px;
            height: 60px;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
        }

        .logo-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }

        .news-section {
            flex: 1;
            overflow: hidden;
            margin: 0 40px;
            position: relative;
        }

        .news-label {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #c0392b;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 4px;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .news-scroll {
            display: flex;
            animation: scroll 60s linear infinite;
            padding-left: 100px;
        }

        .news-item {
            white-space: nowrap;
            padding: 0 50px;
            font-size: 20px;
            color: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
        }

        .news-item::after {
            content: '•';
            margin-left: 50px;
            color: rgba(255, 255, 255, 0.3);
        }

        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        .clock-section {
            flex-shrink: 0;
            text-align: right;
            width: 200px;
        }

        .clock-time {
            font-size: 48px;
            font-weight: 300;
            color: #fff;
            letter-spacing: 2px;
        }

        .clock-date {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 2px;
        }
    </style>
</head>

    <script>
        // Clock
        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var timeStr = (hours < 10 ? '0' : '') + hours + ':' + (minutes < 10 ? '0' : '') + minutes;
            document.getElementById('clockTime').textContent = timeStr;

            var days = ['Søndag', 'Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lørdag'];
            var months = ['januar', 'februar', 'mars', 'april', 'mai', 'juni', 'juli', 'august', 'september', 'oktober', 'november', 'desember'];
            var dateStr = days[now.getDay()] + ' ' + now.getDate() + '. ' + months[now.getMonth()];
            document.getElementById('clockDate').textContent = dateStr;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // RSS News
        function fetchNews() {
            var rssUrl = 'https://www.nrk.no/nyheter/siste.rss';
            var proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rssUrl);

            var xhr = new XMLHttpRequest();
            xhr.open('GET', proxyUrl, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var parser = new DOMParser();
                    var xml = parser.parseFromString(xhr.responseText, 'text/xml');
                    var items = xml.querySelectorAll('item');
                    var headlines = [];

                    for (var i = 0; i < Math.min(items.length, 15); i++) {
                        var title = items[i].querySelector('title');
                        if (title) {
                            headlines.push(title.textContent);
                        }
                    }

                    if (headlines.length > 0) {
                        renderNews(headlines);
                    }
                }
            };
            xhr.send();
        }

        function renderNews(headlines) {
            var newsScroll = document.getElementById('newsScroll');
            var html = '';

            // Duplicate for seamless loop
            for (var i = 0; i < 2; i++) {
                for (var j = 0; j < headlines.length; j++) {
                    html += '<span class="news-item">' + headlines[j] + '</span>';
                }
            }

            newsScroll.innerHTML = html;

            // Adjust animation duration based on content length
            var totalWidth = newsScroll.scrollWidth / 2;
            var duration = totalWidth / 80; // pixels per second
            newsScroll.style.animationDuration = duration + 's';
        }

        fetchNews();
        setInterval(fetchNews, 300000); // Refresh every 5 minutes
    </script>
