<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LVVA KF Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            background: #0a0a0a;
            width: 1920px;
            height: 100px;
            overflow: hidden;
        }

        .banner-container {
            display: flex;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            align-items: center;
            padding: 0 30px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            padding-right: 30px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .logo-section svg {
            height: 50px;
            width: auto;
        }

        .logo-section svg path,
        .logo-section svg g {
            fill: #fff !important;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 3px;
        }

        .logo-subtitle {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .news-section {
            flex: 1;
            overflow: hidden;
            margin: 0 30px;
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .nrk-logo {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nrk-logo svg {
            height: 20px;
            width: auto;
        }

        .news-track {
            width: 100%;
            overflow: hidden;
            mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
            padding-left: 90px;
        }

        .news-scroll {
            display: flex;
            animation: scroll 45s linear infinite;
            will-change: transform;
        }

        .news-item {
            white-space: nowrap;
            padding: 0 60px;
            font-size: 22px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.95);
            display: flex;
            align-items: center;
            letter-spacing: 0.3px;
        }

        .news-item::after {
            content: '';
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            margin-left: 60px;
            flex-shrink: 0;
        }

        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        .clock-section {
            flex-shrink: 0;
            text-align: right;
            padding-left: 30px;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .clock-time {
            font-size: 44px;
            font-weight: 200;
            color: #fff;
            letter-spacing: 3px;
            font-variant-numeric: tabular-nums;
        }

        .clock-date {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 2px;
            letter-spacing: 0.5px;
        }
    </style>
</head>

    <script>
        // Clock
        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var timeStr = (hours < 10 ? '0' : '') + hours + ':' + (minutes < 10 ? '0' : '') + minutes;
            document.getElementById('clockTime').textContent = timeStr;

            var days = ['Sondag', 'Mandag', 'Tirsdag', 'Onsdag', 'Torsdag', 'Fredag', 'Lordag'];
            var months = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];
            var dateStr = days[now.getDay()] + ' ' + now.getDate() + '. ' + months[now.getMonth()];
            document.getElementById('clockDate').textContent = dateStr;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // RSS News
        function fetchNews() {
            var rssUrl = 'https://www.nrk.no/nyheter/siste.rss';
            var proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rssUrl);

            var xhr = new XMLHttpRequest();
            xhr.open('GET', proxyUrl, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var parser = new DOMParser();
                    var xml = parser.parseFromString(xhr.responseText, 'text/xml');
                    var items = xml.querySelectorAll('item');
                    var headlines = [];

                    for (var i = 0; i < Math.min(items.length, 12); i++) {
                        var title = items[i].querySelector('title');
                        if (title) {
                            headlines.push(title.textContent);
                        }
                    }

                    if (headlines.length > 0) {
                        renderNews(headlines);
                    }
                }
            };
            xhr.send();
        }

        function renderNews(headlines) {
            var newsScroll = document.getElementById('newsScroll');
            var html = '';

            // Duplicate for seamless loop
            for (var i = 0; i < 2; i++) {
                for (var j = 0; j < headlines.length; j++) {
                    html += '<span class="news-item">' + headlines[j] + '</span>';
                }
            }

            newsScroll.innerHTML = html;

            // Adjust animation duration based on content length
            var totalWidth = newsScroll.scrollWidth / 2;
            var duration = totalWidth / 120; // faster: 120 pixels per second
            newsScroll.style.animationDuration = duration + 's';
        }

        fetchNews();
        setInterval(fetchNews, 300000); // Refresh every 5 minutes
    </script>
