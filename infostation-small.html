<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lier Infostation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            width: 1080px;
            height: 330px;
            overflow: hidden;
        }

        .infostation {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1e3a5f 0%, #0d1b2a 100%);
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 8px;
        }

        /* ========== BANNER SECTION ========== */
        .banner {
            display: flex;
            height: 70px;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex-shrink: 0;
        }

        .logo-section {
            display: flex;
            align-items: center;
            padding: 0 16px;
            height: 100%;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
        }

        .kommune-logo {
            height: 32px;
            width: auto;
            flex-shrink: 0;
        }

        .news-section {
            flex: 1;
            display: flex;
            align-items: center;
            height: 100%;
            overflow: hidden;
            padding-left: 16px;
        }

        .nrk-badge {
            height: 16px;
            margin-right: 12px;
            flex-shrink: 0;
            opacity: 0.9;
        }

        .news-container {
            flex: 1;
            overflow: hidden;
            mask-image: linear-gradient(to right, black 0%, black 95%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 0%, black 95%, transparent 100%);
        }

        .news-ticker {
            display: flex;
            animation: ticker 50s linear infinite;
        }

        .news-item {
            white-space: nowrap;
            padding-right: 50px;
            font-size: 13px;
            color: #c9d1d9;
            font-weight: 400;
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .clock-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            padding: 0 16px;
            height: 100%;
            border-left: 1px solid rgba(255, 255, 255, 0.06);
        }

        .clock-time {
            font-size: 28px;
            font-weight: 300;
            color: #f0f6fc;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .clock-date {
            font-size: 10px;
            color: #8b949e;
            margin-top: 2px;
        }

        /* ========== WEATHER SECTION ========== */
        .weather-row {
            display: flex;
            flex: 1;
            gap: 8px;
            min-height: 0;
        }

        .sun-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 65px;
            flex-shrink: 0;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .sun-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .sun-icon {
            font-size: 18px;
        }

        .sun-time {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .sun-label {
            font-size: 7px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .location-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 10px 12px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
            min-width: 0;
        }

        .location-name {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            text-align: center;
        }

        .current-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .weather-icon {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .weather-icon img {
            width: 100%;
            height: 100%;
        }

        .current-info {
            display: flex;
            flex-direction: column;
        }

        .current-temp {
            font-size: 28px;
            font-weight: 300;
            color: #fff;
            line-height: 1;
        }

        .current-temp .unit {
            font-size: 14px;
            opacity: 0.5;
        }

        .current-detail {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        .forecast-section {
            display: flex;
            justify-content: space-between;
            flex: 1;
            min-width: 0;
        }

        .forecast-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .forecast-time {
            font-size: 10px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 2px;
        }

        .forecast-icon {
            width: 26px;
            height: 26px;
            margin-bottom: 2px;
        }

        .forecast-icon img {
            width: 100%;
            height: 100%;
        }

        .forecast-temp {
            font-size: 13px;
            font-weight: 500;
            color: #fff;
        }

        .forecast-precip {
            font-size: 9px;
            color: #5dade2;
            min-height: 12px;
            font-weight: 500;
        }

        .temp-freezing { color: #85c1e9; }
        .temp-cold { color: #aed6f1; }
        .temp-cool { color: #d5dbdb; }
        .temp-mild { color: #f9e79f; }
        .temp-warm { color: #f5b041; }
        .temp-hot { color: #e74c3c; }

        .loading {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 10px;
            text-align: center;
        }

        .attribution {
            position: absolute;
            bottom: 2px;
            right: 6px;
            font-size: 7px;
            color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <script>
        // ========== CLOCK ==========
        function updateClock() {
            var now = new Date();
            var h = now.getHours();
            var m = now.getMinutes();
            document.getElementById('clockTime').textContent =
                (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;

            var days = ['sondag', 'mandag', 'tirsdag', 'onsdag', 'torsdag', 'fredag', 'lordag'];
            var months = ['jan', 'feb', 'mar', 'apr', 'mai', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'des'];
            document.getElementById('clockDate').textContent =
                days[now.getDay()] + ' ' + now.getDate() + '. ' + months[now.getMonth()];
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ========== NEWS ==========
        function fetchNews() {
            var rssUrl = 'https://www.nrk.no/nyheter/siste.rss';
            var proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rssUrl);

            var xhr = new XMLHttpRequest();
            xhr.open('GET', proxyUrl, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var parser = new DOMParser();
                    var xml = parser.parseFromString(xhr.responseText, 'text/xml');
                    var items = xml.querySelectorAll('item');
                    var headlines = [];

                    for (var i = 0; i < Math.min(items.length, 10); i++) {
                        var title = items[i].querySelector('title');
                        if (title) headlines.push(title.textContent);
                    }

                    if (headlines.length > 0) renderNews(headlines);
                }
            };
            xhr.send();
        }

        function renderNews(headlines) {
            var ticker = document.getElementById('newsTicker');
            var html = '';
            for (var r = 0; r < 2; r++) {
                for (var i = 0; i < headlines.length; i++) {
                    html += '<span class="news-item">' + headlines[i] + '</span>';
                }
            }
            ticker.innerHTML = html;
            var width = ticker.scrollWidth / 2;
            ticker.style.animationDuration = (width / 80) + 's';
        }
        fetchNews();
        setInterval(fetchNews, 300000);

        // ========== SUNRISE/SUNSET ==========
        function fetchSunTimes() {
            var today = new Date();
            var dateStr = today.getFullYear() + '-' +
                ((today.getMonth() + 1) < 10 ? '0' : '') + (today.getMonth() + 1) + '-' +
                (today.getDate() < 10 ? '0' : '') + today.getDate();

            var sunUrl = 'https://api.met.no/weatherapi/sunrise/3.0/sun?lat=59.79&lon=10.25&date=' + dateStr + '&offset=%2B01:00';

            var xhr = new XMLHttpRequest();
            xhr.open('GET', sunUrl, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        if (data.properties && data.properties.sunrise && data.properties.sunset) {
                            var srMatch = data.properties.sunrise.time.match(/T(\d{2}):(\d{2})/);
                            var ssMatch = data.properties.sunset.time.match(/T(\d{2}):(\d{2})/);
                            if (srMatch) document.getElementById('sunrise').textContent = srMatch[1] + ':' + srMatch[2];
                            if (ssMatch) document.getElementById('sunset').textContent = ssMatch[1] + ':' + ssMatch[2];
                        }
                    } catch (e) {}
                }
            };
            xhr.send();
        }

        // ========== WEATHER ==========
        var locations = {
            lierbyen: { name: 'Lierbyen', lat: 59.7925, lon: 10.2425 },
            lierstranda: { name: 'Lierstranda', lat: 59.7566, lon: 10.2583 },
            tranby: { name: 'Tranby', lat: 59.8089, lon: 10.3056 },
            sylling: { name: 'Sylling', lat: 59.8633, lon: 10.1850 }
        };

        var workerUrl = 'https://blue-wind-cec8.tobiassundal.workers.dev';
        var iconBaseUrl = 'https://nrkno.github.io/yr-weather-symbols/symbols/darkmode/';

        var symbolToId = {
            'clearsky_day': '01d', 'clearsky_night': '01n', 'fair_day': '02d', 'fair_night': '02n',
            'partlycloudy_day': '03d', 'partlycloudy_night': '03n', 'cloudy': '04',
            'rainshowers_day': '05d', 'rainshowers_night': '05n', 'rain': '09', 'heavyrain': '10',
            'sleet': '12', 'snow': '13', 'fog': '15', 'lightrain': '46', 'lightsnow': '49'
        };

        function getIconUrl(symbolCode) {
            return iconBaseUrl + (symbolToId[symbolCode] || '04') + '.svg';
        }

        function getWindArrow(degrees) {
            return ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'][Math.round(degrees / 45) % 8];
        }

        function getTempClass(temp) {
            if (temp < -5) return 'temp-freezing';
            if (temp < 3) return 'temp-cold';
            if (temp < 10) return 'temp-cool';
            if (temp < 17) return 'temp-mild';
            if (temp < 24) return 'temp-warm';
            return 'temp-hot';
        }

        function formatTime(isoString) {
            var d = new Date(isoString);
            return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
        }

        function fetchWeather(locationKey, callback) {
            var loc = locations[locationKey];
            var xhr = new XMLHttpRequest();
            xhr.open('GET', workerUrl + '?lat=' + loc.lat + '&lon=' + loc.lon, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try { callback(null, JSON.parse(xhr.responseText)); }
                        catch (e) { callback(e, null); }
                    } else { callback(new Error('HTTP ' + xhr.status), null); }
                }
            };
            xhr.send();
        }

        function renderWeatherCard(locationKey, data) {
            var card = document.querySelector('[data-location="' + locationKey + '"]');
            var loc = locations[locationKey];

            if (!data) {
                card.innerHTML = '<div class="location-name">' + loc.name + '</div><div class="error-msg">Ingen data</div>';
                return;
            }

            try {
                var ts = data.properties.timeseries;
                var current = ts[0];
                var details = current.data.instant.details;
                var next1h = current.data.next_1_hours;

                var temp = Math.round(details.air_temperature);
                var wind = details.wind_speed.toFixed(1);
                var windDir = details.wind_from_direction;
                var symbol = (next1h && next1h.summary) ? next1h.summary.symbol_code : 'fair_day';

                var now = new Date();
                var forecastHTML = '';
                var hours = [2, 4, 6, 8];

                for (var i = 0; i < hours.length; i++) {
                    var target = new Date(now.getTime() + hours[i] * 3600000);
                    var closest = ts[0], minDiff = Infinity;

                    for (var j = 0; j < ts.length; j++) {
                        var diff = Math.abs(new Date(ts[j].time) - target);
                        if (diff < minDiff) { minDiff = diff; closest = ts[j]; }
                    }

                    var fd = closest.data.instant.details;
                    var fn = closest.data.next_1_hours || closest.data.next_6_hours;
                    var fTemp = Math.round(fd.air_temperature);
                    var fSym = (fn && fn.summary) ? fn.summary.symbol_code : 'fair_day';
                    var fPrec = (fn && fn.details) ? fn.details.precipitation_amount : 0;

                    forecastHTML += '<div class="forecast-item">' +
                        '<span class="forecast-time">' + formatTime(closest.time) + '</span>' +
                        '<span class="forecast-icon"><img src="' + getIconUrl(fSym) + '" alt=""></span>' +
                        '<span class="forecast-temp ' + getTempClass(fTemp) + '">' + fTemp + '°</span>' +
                        '<span class="forecast-precip">' + (fPrec > 0.1 ? fPrec.toFixed(1) + 'mm' : '') + '</span>' +
                        '</div>';
                }

                card.innerHTML = '<div class="location-name">' + loc.name + '</div>' +
                    '<div class="current-section">' +
                        '<span class="weather-icon"><img src="' + getIconUrl(symbol) + '" alt=""></span>' +
                        '<div class="current-info">' +
                            '<span class="current-temp ' + getTempClass(temp) + '">' + temp + '<span class="unit">°</span></span>' +
                            '<span class="current-detail">' + getWindArrow(windDir) + ' ' + wind + ' m/s</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="forecast-section">' + forecastHTML + '</div>' +
                    '<span class="attribution">yr.no</span>';

            } catch (e) {
                card.innerHTML = '<div class="location-name">' + loc.name + '</div><div class="error-msg">Feil</div>';
            }
        }

        function initWeather() {
            fetchSunTimes();
            ['lierbyen', 'lierstranda', 'tranby', 'sylling'].forEach(function(key) {
                fetchWeather(key, function(err, data) { renderWeatherCard(key, err ? null : data); });
            });
        }

        initWeather();
        setInterval(initWeather, 600000);
    </script>
</body>
</html>
