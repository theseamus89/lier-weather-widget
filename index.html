<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080">
    <title>Vær Lier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            background: #0a0a0a;
            width: 1080px;
            height: 200px;
            overflow: hidden;
        }

        .weather-container {
            display: flex;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1e3a5f 0%, #0d1b2a 100%);
            padding: 8px;
            gap: 8px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            flex-shrink: 0;
        }

        .logo-section svg {
            width: 50px;
            height: auto;
            opacity: 0.85;
        }

        .location-card {
            flex: 1;
            display: flex;
            flex-direction: row;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px 14px;
            gap: 12px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            min-width: 0;
        }

        .current-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 130px;
            flex-shrink: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding-right: 12px;
        }

        .location-name {
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .current-main {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .weather-icon {
            width: 56px;
            height: 56px;
            flex-shrink: 0;
        }

        .weather-icon img {
            width: 100%;
            height: 100%;
        }

        .current-temp {
            font-size: 38px;
            font-weight: 300;
            color: #fff;
            line-height: 1;
        }

        .current-temp .unit {
            font-size: 20px;
            opacity: 0.5;
        }

        .current-detail {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        .forecast-section {
            display: flex;
            flex: 1;
            justify-content: space-around;
            align-items: center;
            min-width: 0;
        }

        .forecast-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 4px;
        }

        .forecast-time {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 4px;
        }

        .forecast-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 4px;
        }

        .forecast-icon img {
            width: 100%;
            height: 100%;
        }

        .forecast-temp {
            font-size: 20px;
            font-weight: 500;
            color: #fff;
        }

        .forecast-precip {
            font-size: 12px;
            color: #5dade2;
            min-height: 16px;
            font-weight: 500;
        }

        .temp-freezing { color: #85c1e9; }
        .temp-cold { color: #aed6f1; }
        .temp-cool { color: #d5dbdb; }
        .temp-mild { color: #f9e79f; }
        .temp-warm { color: #f5b041; }
        .temp-hot { color: #e74c3c; }

        .loading {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 16px;
        }

        .attribution {
            position: absolute;
            bottom: 4px;
            right: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>

    <script>
        var locations = {
            lierbyen: { name: 'LIERBYEN', lat: 59.7925, lon: 10.2425 },
            lierstranda: { name: 'LIERSTRANDA', lat: 59.7566, lon: 10.2583 },
            tranby: { name: 'TRANBY', lat: 59.8089, lon: 10.3056 },
            sylling: { name: 'SYLLING', lat: 59.8633, lon: 10.1850 }
        };

        var workerUrl = 'https://blue-wind-cec8.tobiassundal.workers.dev';
        var iconBaseUrl = 'https://nrkno.github.io/yr-weather-symbols/symbols/darkmode/';

        // Mapping from YR API symbol_code to NRK icon ID
        var symbolToId = {
            'clearsky_day': '01d',
            'clearsky_night': '01n',
            'clearsky_polartwilight': '01m',
            'fair_day': '02d',
            'fair_night': '02n',
            'fair_polartwilight': '02m',
            'partlycloudy_day': '03d',

            'sleetshowersandthunder_polartwilight': '20m',
            'snowshowersandthunder_day': '21d',

            'rainandthunder': '22',
            'sleetandthunder': '23',

            'lightrainshowersandthunder_night': '24n',
            'lightrainshowersandthunder_polartwilight': '24m',
            'heavyrainshowersandthunder_day': '25d',
            'heavyrainshowersandthunder_night': '25n',
            'heavyrainshowersandthunder_polartwilight': '25m',
            'lightssleetshowersandthunder_day': '26d',
            'lightssleetshowersandthunder_night': '26n',
            'lightssleetshowersandthunder_polartwilight': '26m',
            'heavysleetshowersandthunder_day': '27d',
            'heavysleetshowersandthunder_night': '27n',
            'heavysleetshowersandthunder_polartwilight': '27m',
            'lightssnowshowersandthunder_day': '28d',
            'lightssnowshowersandthunder_night': '28n',
            'lightssnowshowersandthunder_polartwilight': '28m',
            'heavysnowshowersandthunder_day': '29d',
            'heavysnowshowersandthunder_night': '29n',
            'heavysnowshowersandthunder_polartwilight': '29m',
            'lightrainandthunder': '30',
            'lightsleetandthunder': '31',
            'heavysleetandthunder': '32',
            'lightsnowandthunder': '33',
            'heavysnowandthunder': '34',
            'lightrainshowers_day': '40d',
            'lightrainshowers_night': '40n',
            'lightrainshowers_polartwilight': '40m',
            'heavyrainshowers_day': '41d',
            'heavyrainshowers_night': '41n',
            'heavyrainshowers_polartwilight': '41m',

            'lightsnowshowers_day': '44d',

            'lightsnowshowers_polartwilight': '44m',
            'heavysnowshowers_day': '45d',
            'heavysnowshowers_night': '45n',
            'heavysnowshowers_polartwilight': '45m',
            'lightrain': '46',
            'lightsleet': '47',
            'heavysleet': '48',
            'lightsnow': '49',
            'heavysnow': '50'
        };

        function getIconUrl(symbolCode) {
            var iconId = symbolToId[symbolCode] || '04';
            return iconBaseUrl + iconId + '.svg';
        }

        function getWindArrow(degrees) {
            var arrows = ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'];
            return arrows[Math.round(degrees / 45) % 8];
        }

        function getTempClass(temp) {
            if (temp < -5) return 'temp-freezing';
            if (temp < 3) return 'temp-cold';
            if (temp < 10) return 'temp-cool';
            if (temp < 17) return 'temp-mild';
            if (temp < 24) return 'temp-warm';
            return 'temp-hot';
        }

        function formatTime(isoString) {
            var date = new Date(isoString);
            var h = date.getHours();
            var m = date.getMinutes();
            return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
        }

        function fetchWeather(locationKey, callback) {
            var loc = locations[locationKey];
            var url = workerUrl + '?lat=' + loc.lat + '&lon=' + loc.lon;

            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(null, data);
                        } catch (e) {
                            callback(e, null);
                        }
                    } else {
                        callback(new Error('HTTP ' + xhr.status), null);
                    }
                }
            };
            xhr.send();
        }

        function renderWeatherCard(locationKey, data) {
            var card = document.querySelector('[data-location="' + locationKey + '"]');
            var loc = locations[locationKey];

            if (!data) {
                card.innerHTML = '<div class="current-section">' +
                    '<div class="location-name">' + loc.name + '</div>' +
                    '<div class="error-msg">Ingen data</div>' +
                    '</div>';
                return;
            }

            try {
                var timeseries = data.properties.timeseries;
                var current = timeseries[0];
                var currentInstant = current.data.instant.details;
                var currentNext1h = current.data.next_1_hours;

                var currentTemp = Math.round(currentInstant.air_temperature);
                var windSpeed = currentInstant.wind_speed.toFixed(1);
                var windDir = currentInstant.wind_from_direction;
                var currentSymbol = (currentNext1h && currentNext1h.summary) ? currentNext1h.summary.symbol_code : 'fair_day';

                var now = new Date();
                var forecastHours = [2, 4, 6, 8];
                var forecastHTML = '';

                for (var i = 0; i < forecastHours.length; i++) {
                    var hoursAhead = forecastHours[i];
                    var targetTime = new Date(now.getTime() + hoursAhead * 60 * 60 * 1000);

                    var closest = timeseries[0];
                    var minDiff = Infinity;

                    for (var j = 0; j < timeseries.length; j++) {
                        var ts = timeseries[j];
                        var tsTime = new Date(ts.time);
                        var diff = Math.abs(tsTime - targetTime);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closest = ts;
                        }
                    }

                    var instant = closest.data.instant.details;
                    var next1h = closest.data.next_1_hours || closest.data.next_6_hours;
                    var fTemp = Math.round(instant.air_temperature);
                    var fSymbol = (next1h && next1h.summary) ? next1h.summary.symbol_code : 'fair_day';
                    var fPrecip = (next1h && next1h.details) ? next1h.details.precipitation_amount : 0;

                    forecastHTML += '<div class="forecast-item">' +
                        '<span class="forecast-time">' + formatTime(closest.time) + '</span>' +
                        '<span class="forecast-icon"><img src="' + getIconUrl(fSymbol) + '" alt=""></span>' +
                        '<span class="forecast-temp ' + getTempClass(fTemp) + '">' + fTemp + '°</span>' +
                        '<span class="forecast-precip">' + (fPrecip > 0.1 ? fPrecip.toFixed(1) + 'mm' : '') + '</span>' +
                        '</div>';
                }

                card.innerHTML = '<div class="current-section">' +
                    '<div class="location-name">' + loc.name + '</div>' +
                    '<div class="current-main">' +
                        '<span class="weather-icon"><img src="' + getIconUrl(currentSymbol) + '" alt=""></span>' +
                        '<span class="current-temp ' + getTempClass(currentTemp) + '">' + currentTemp + '<span class="unit">°</span></span>' +
                    '</div>' +
                    '<div class="current-detail">' + getWindArrow(windDir) + ' ' + windSpeed + ' m/s</div>' +
                    '</div>' +
                    '<div class="forecast-section">' + forecastHTML + '</div>' +
                    '<span class="attribution">yr.no</span>';

            } catch (error) {
                card.innerHTML = '<div class="current-section">' +
                    '<div class="location-name">' + loc.name + '</div>' +
                    '<div class="error-msg">Feil</div>' +
                    '</div>';
            }
        }

        function initWeather() {
            var keys = ['lierbyen', 'lierstranda', 'tranby', 'sylling'];

            for (var i = 0; i < keys.length; i++) {
                (function(key) {
                    fetchWeather(key, function(err, data) {
                        renderWeatherCard(key, err ? null : data);
                    });
                })(keys[i]);
            }
        }

        initWeather();
        setInterval(initWeather, 600000);
    </script>
</body>
</html>
