<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=1080">
    <title>Weather Lier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            background: #0a0a0a;
            width: 1080px;
            height: 100px;
            overflow: hidden;
        }
        
        .weather-container {
            display: flex;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1e3a5f 0%, #0d1b2a 100%);
            padding: 4px;
            gap: 4px;
        }
        
        .location-card {
            flex: 1;
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 6px 8px;
            gap: 8px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            min-width: 0;
        }
        
        .current-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 85px;
            flex-shrink: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding-right: 8px;
        }
        
        .location-name {
            font-size: 9px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .current-main {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .weather-icon {
            font-size: 20px;
            line-height: 1;
            color: #ffd700;
        }
        
        .current-temp {
            font-size: 22px;
            font-weight: 300;
            color: #fff;
            line-height: 1;
        }
        
        .current-temp .unit {
            font-size: 12px;
            opacity: 0.5;
        }
        
        .current-detail {
            font-size: 8px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 3px;
        }
        
        .forecast-section {
            display: flex;
            flex: 1;
            justify-content: space-between;
            align-items: center;
            min-width: 0;
            overflow: hidden;
        }
        
        .forecast-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 2px;
            min-width: 0;
            flex: 1;
        }
        
        .forecast-time {
            font-size: 8px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 2px;
        }
        
        .forecast-icon {
            font-size: 14px;
            margin-bottom: 2px;
            line-height: 1;
            color: #ffd700;
        }
        
        .forecast-temp {
            font-size: 11px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
        }
        
        .forecast-precip {
            font-size: 7px;
            color: #5dade2;
            min-height: 10px;
            font-weight: 500;
        }
        
        .temp-freezing { color: #85c1e9; }
        .temp-cold { color: #aed6f1; }
        .temp-cool { color: #d5dbdb; }
        .temp-mild { color: #f9e79f; }
        .temp-warm { color: #f5b041; }
        .temp-hot { color: #e74c3c; }
        
        .loading {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
        }
        
        .error-state .location-name {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .error-msg {
            color: #e74c3c;
            font-size: 9px;
        }
        
        .attribution {
            position: absolute;
            bottom: 3px;
            right: 6px;
            font-size: 7px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 0.5px;
        }
        
        /* Weather icon colors */
        .icon-sun { color: #ffd700; }
        .icon-cloud { color: #b0b0b0; }
        .icon-rain { color: #5dade2; }
        .icon-snow { color: #ffffff; }
        .icon-thunder { color: #f39c12; }
        .icon-fog { color: #95a5a6; }
    </style>
</head>
<body>
    <div class="weather-container" id="weatherContainer">
        <div class="location-card" data-location="lierbyen">
            <div class="loading">Loading...</div>
        </div>
        <div class="location-card" data-location="lierstranda">
            <div class="loading">Loading...</div>
        </div>
        <div class="location-card" data-location="tranby">
            <div class="loading">Loading...</div>
        </div>
        <div class="location-card" data-location="sylling">
            <div class="loading">Loading...</div>
        </div>
    </div>
    
    <script>
        var locations = {
            lierbyen: { name: 'LIERBYEN', lat: 59.7925, lon: 10.2425 },
            lierstranda: { name: 'LIERSTRANDA', lat: 59.7566, lon: 10.2583 },
            tranby: { name: 'TRANBY', lat: 59.8089, lon: 10.3056 },
            sylling: { name: 'SYLLING', lat: 59.8633, lon: 10.1850 }
        };
        
        var workerUrl = 'https://blue-wind-cec8.tobiassundal.workers.dev';
        
        // Simple text-based weather icons (ASCII safe)
        var weatherIcons = {
            'clearsky': { icon: '*', css: 'icon-sun' },
            'fair': { icon: '~*', css: 'icon-sun' },
            'partlycloudy': { icon: '~', css: 'icon-cloud' },
            'cloudy': { icon: '~~', css: 'icon-cloud' },
            'rain': { icon: ',,', css: 'icon-rain' },
            'lightrain': { icon: ',', css: 'icon-rain' },
            'heavyrain': { icon: ',,,', css: 'icon-rain' },
            'rainshowers': { icon: '~,', css: 'icon-rain' },
            'lightrainshowers': { icon: '~,', css: 'icon-rain' },
            'heavyrainshowers': { icon: '~,,', css: 'icon-rain' },
            'sleet': { icon: ',*', css: 'icon-rain' },
            'sleetshowers': { icon: '~,*', css: 'icon-rain' },
            'snow': { icon: '**', css: 'icon-snow' },
            'lightsnow': { icon: '*', css: 'icon-snow' },
            'heavysnow': { icon: '***', css: 'icon-snow' },
            'snowshowers': { icon: '~*', css: 'icon-snow' },
            'lightsnowshowers': { icon: '~*', css: 'icon-snow' },
            'heavysnowshowers': { icon: '~**', css: 'icon-snow' },
            'fog': { icon: '=', css: 'icon-fog' },
            'thunder': { icon: '!', css: 'icon-thunder' }
        };
        
        function getWeatherIcon(symbolCode) {
            var baseName = symbolCode.replace(/_day|_night|_polartwilight/g, '');
            
            // Check for thunder
            if (baseName.indexOf('thunder') !== -1) {
                return weatherIcons['thunder'];
            }
            
            // Find matching icon
            for (var key in weatherIcons) {
                if (baseName.indexOf(key) !== -1) {
                    return weatherIcons[key];
                }
            }
            
            return { icon: '?', css: 'icon-cloud' };
        }
        
        function getWindArrow(degrees) {
            var arrows = ['v', 'v', '<', '<', '^', '^', '>', '>'];
            return arrows[Math.round(degrees / 45) % 8];
        }
        
        function getTempClass(temp) {
            if (temp < -5) return 'temp-freezing';
            if (temp < 3) return 'temp-cold';
            if (temp < 10) return 'temp-cool';
            if (temp < 17) return 'temp-mild';
            if (temp < 24) return 'temp-warm';
            return 'temp-hot';
        }
        
        function formatHour(isoString) {
            var date = new Date(isoString);
            var h = date.getHours();
            return (h < 10 ? '0' : '') + h;
        }
        
        function fetchWeather(locationKey, callback) {
            var loc = locations[locationKey];
            var url = workerUrl + '?lat=' + loc.lat + '&lon=' + loc.lon;
            
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            callback(null, data);
                        } catch (e) {
                            callback(e, null);
                        }
                    } else {
                        callback(new Error('HTTP ' + xhr.status), null);
                    }
                }
            };
            xhr.send();
        }
        
        function renderWeatherCard(locationKey, data) {
            var card = document.querySelector('[data-location="' + locationKey + '"]');
            var loc = locations[locationKey];
            
            if (!data) {
                card.innerHTML = '<div class="current-section error-state">' +
                    '<div class="location-name">' + loc.name + '</div>' +
                    '<div class="error-msg">No data</div>' +
                    '</div>';
                return;
            }
            
            try {
                var timeseries = data.properties.timeseries;
                var current = timeseries[0];
                var currentInstant = current.data.instant.details;
                var currentNext1h = current.data.next_1_hours;
                
                var currentTemp = Math.round(currentInstant.air_temperature);
                var windSpeed = currentInstant.wind_speed.toFixed(1);
                var windDir = currentInstant.wind_from_direction;
                var currentSymbol = (currentNext1h && currentNext1h.summary) ? currentNext1h.summary.symbol_code : 'fair_day';
                var currentIcon = getWeatherIcon(currentSymbol);
                
                // Forecast
                var now = new Date();
                var forecastHours = [2, 4, 6, 8];
                var forecastHTML = '';
                
                for (var i = 0; i < forecastHours.length; i++) {
                    var hoursAhead = forecastHours[i];
                    var targetTime = new Date(now.getTime() + hoursAhead * 60 * 60 * 1000);
                    
                    var closest = timeseries[0];
                    var minDiff = Infinity;
                    
                    for (var j = 0; j < timeseries.length; j++) {
                        var ts = timeseries[j];
                        var tsTime = new Date(ts.time);
                        var diff = Math.abs(tsTime - targetTime);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closest = ts;
                        }
                    }
                    
                    var instant = closest.data.instant.details;
                    var next1h = closest.data.next_1_hours || closest.data.next_6_hours;
                    var fTemp = Math.round(instant.air_temperature);
                    var fSymbol = (next1h && next1h.summary) ? next1h.summary.symbol_code : 'fair_day';
                    var fIcon = getWeatherIcon(fSymbol);
                    var fPrecip = (next1h && next1h.details) ? next1h.details.precipitation_amount : 0;
                    
                    forecastHTML += '<div class="forecast-item">' +
                        '<span class="forecast-time">' + formatHour(closest.time) + '</span>' +
                        '<span class="forecast-icon ' + fIcon.css + '">' + fIcon.icon + '</span>' +
                        '<span class="forecast-temp ' + getTempClass(fTemp) + '">' + fTemp + 'C</span>' +
                        '<span class="forecast-precip">' + (fPrecip > 0.1 ? fPrecip.toFixed(1) + 'mm' : '') + '</span>' +
                        '</div>';
                }
                
                card.innerHTML = '<div class="current-section">' +
                    '<div class="location-name">' + loc.name + '</div>' +
                    '<div class="current-main">' +
                        '<span class="weather-icon ' + currentIcon.css + '">' + currentIcon.icon + '</span>' +
                        '<span class="current-temp ' + getTempClass(currentTemp) + '">' + currentTemp + '<span class="unit">C</span></span>' +
                    '</div>' +
                    '<div class="current-detail">' + getWindArrow(windDir) + ' ' + windSpeed + ' m/s</div>' +
                    '</div>' +
                    '<div class="forecast-section">' + forecastHTML + '</div>' +
                    '<span class="attribution">yr.no</span>';
                    
            } catch (error) {
                card.innerHTML = '<div class="current-section error-state">' +
                    '<div class="location-name">' + loc.name + '</div>' +
                    '<div class="error-msg">Error</div>' +
                    '</div>';
            }
        }
        
        function initWeather() {
            var keys = ['lierbyen', 'lierstranda', 'tranby', 'sylling'];
            
            for (var i = 0; i < keys.length; i++) {
                (function(key) {
                    fetchWeather(key, function(err, data) {
                        renderWeatherCard(key, err ? null : data);
                    });
                })(keys[i]);
            }
        }
        
        initWeather();
        setInterval(initWeather, 600000);
    </script>
</body>
</html>
