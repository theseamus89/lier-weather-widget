<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vær Lier - Wide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            background: #0a0a0a;
            width: 1920px;
            height: 250px;
            overflow: hidden;
        }

        .weather-container {
            display: flex;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1e3a5f 0%, #0d1b2a 100%);
            padding: 10px;
            gap: 10px;
        }

        .sun-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90px;
            flex-shrink: 0;
            gap: 16px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .sun-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .sun-icon {
            font-size: 24px;
        }

        .sun-time {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .sun-label {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .location-card {
            flex: 1;
            display: flex;
            flex-direction: row;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 16px 20px;
            gap: 24px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            min-width: 0;
        }

        .current-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 160px;
            padding-right: 24px;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        .location-name {
            font-size: 15px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .current-main {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .weather-icon {
            width: 72px;
            height: 72px;
            flex-shrink: 0;
        }

        .weather-icon img {
            width: 100%;
            height: 100%;
        }

        .current-info {
            display: flex;
            flex-direction: column;
        }

        .current-temp {
            font-size: 48px;
            font-weight: 300;
            color: #fff;
            line-height: 1;
        }

        .current-temp .unit {
            font-size: 24px;
            opacity: 0.5;
        }

        .current-detail {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 6px;
        }

        .forecast-section {
            display: flex;
            flex: 1;
            justify-content: flex-start;
            align-items: center;
            align-content: center;
            min-width: 0;
            flex-wrap: wrap;
            gap: 4px 0;
        }

        .forecast-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 25%;
            padding: 2px 0;
        }

        .forecast-time {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 2px;
        }

        .forecast-icon {
            width: 28px;
            height: 28px;
            margin-bottom: 2px;
        }

        .forecast-icon img {
            width: 100%;
            height: 100%;
        }

        .forecast-temp {
            font-size: 13px;
            font-weight: 500;
            color: #fff;
        }

        .forecast-precip {
            font-size: 9px;
            color: #5dade2;
            min-height: 12px;
            font-weight: 500;
        }

        .temp-freezing { color: #85c1e9; }
        .temp-cold { color: #aed6f1; }
        .temp-cool { color: #d5dbdb; }
        .temp-mild { color: #f9e79f; }
        .temp-warm { color: #f5b041; }
        .temp-hot { color: #e74c3c; }

        .loading {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 14px;
        }

        .attribution {
            position: absolute;
            bottom: 6px;
            right: 12px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>
    <div class="weather-container" id="weatherContainer">
        <div class="sun-section" id="sunSection">
            <div class="sun-item">
                <span class="sun-icon">🌅</span>
                <span class="sun-time" id="sunrise">--:--</span>
                <span class="sun-label">Oppgang</span>
            </div>
            <div class="sun-item">
                <span class="sun-icon">🌇</span>
                <span class="sun-time" id="sunset">--:--</span>
                <span class="sun-label">Nedgang</span>
            </div>
        </div>
        <div class="location-card" data-location="lierbyen">
            <div class="loading">Laster...</div>
        </div>
        <div class="location-card" data-location="lierstranda">
            <div class="loading">Laster...</div>
        </div>
        <div class="location-card" data-location="tranby">
            <div class="loading">Laster...</div>
        </div>
        <div class="location-card" data-location="sylling">
            <div class="loading">Laster...</div>
        </div>
    </div>

    <script>
        var locations = {
            lierbyen: { name: 'Lierbyen', lat: 59.7925, lon: 10.2425 },
            lierstranda: { name: 'Lierstranda', lat: 59.7566, lon: 10.2583 },
            tranby: { name: 'Tranby', lat: 59.8089, lon: 10.3056 },
            sylling: { name: 'Sylling', lat: 59.8633, lon: 10.1850 }
        };

        var workerUrl = 'https://blue-wind-cec8.tobiassundal.workers.dev';
        var iconBaseUrl = 'https://nrkno.github.io/yr-weather-symbols/symbols/darkmode/';

        var symbolToId = {
            'clearsky_day': '01d', 'clearsky_night': '01n', 'clearsky_polartwilight': '01m',
            'fair_day': '02d', 'fair_night': '02n', 'fair_polartwilight': '02m',
            'partlycloudy_day': '03d', 'partlycloudy_night': '03n', 'partlycloudy_polartwilight': '03m',
            'cloudy': '04',
            'rainshowers_day': '05d', 'rainshowers_night': '05n', 'rainshowers_polartwilight': '05m',
            'rainshowersandthunder_day': '06d', 'rainshowersandthunder_night': '06n', 'rainshowersandthunder_polartwilight': '06m',
            'sleetshowers_day': '07d', 'sleetshowers_night': '07n', 'sleetshowers_polartwilight': '07m',
            'snowshowers_day': '08d', 'snowshowers_night': '08n', 'snowshowers_polartwilight': '08m',
            'rain': '09', 'heavyrain': '10', 'heavyrainandthunder': '11',
            'sleet': '12', 'snow': '13', 'snowandthunder': '14', 'fog': '15',
            'sleetshowersandthunder_day': '20d', 'sleetshowersandthunder_night': '20n', 'sleetshowersandthunder_polartwilight': '20m',
            'snowshowersandthunder_day': '21d', 'snowshowersandthunder_night': '21n', 'snowshowersandthunder_polartwilight': '21m',
            'rainandthunder': '22', 'sleetandthunder': '23',
            'lightrainshowersandthunder_day': '24d', 'lightrainshowersandthunder_night': '24n', 'lightrainshowersandthunder_polartwilight': '24m',
            'heavyrainshowersandthunder_day': '25d', 'heavyrainshowersandthunder_night': '25n', 'heavyrainshowersandthunder_polartwilight': '25m',
            'lightssleetshowersandthunder_day': '26d', 'lightssleetshowersandthunder_night': '26n', 'lightssleetshowersandthunder_polartwilight': '26m',
            'heavysleetshowersandthunder_day': '27d', 'heavysleetshowersandthunder_night': '27n', 'heavysleetshowersandthunder_polartwilight': '27m',
            'lightssnowshowersandthunder_day': '28d', 'lightssnowshowersandthunder_night': '28n', 'lightssnowshowersandthunder_polartwilight': '28m',
            'heavysnowshowersandthunder_day': '29d', 'heavysnowshowersandthunder_night': '29n', 'heavysnowshowersandthunder_polartwilight': '29m',
            'lightrainandthunder': '30', 'lightsleetandthunder': '31', 'heavysleetandthunder': '32',
            'lightsnowandthunder': '33', 'heavysnowandthunder': '34',
            'lightrainshowers_day': '40d', 'lightrainshowers_night': '40n', 'lightrainshowers_polartwilight': '40m',
            'heavyrainshowers_day': '41d', 'heavyrainshowers_night': '41n', 'heavyrainshowers_polartwilight': '41m',
            'lightsleetshowers_day': '42d', 'lightsleetshowers_night': '42n', 'lightsleetshowers_polartwilight': '42m',
            'heavysleetshowers_day': '43d', 'heavysleetshowers_night': '43n', 'heavysleetshowers_polartwilight': '43m',
            'lightsnowshowers_day': '44d', 'lightsnowshowers_night': '44n', 'lightsnowshowers_polartwilight': '44m',
            'heavysnowshowers_day': '45d', 'heavysnowshowers_night': '45n', 'heavysnowshowers_polartwilight': '45m',
            'lightrain': '46', 'lightsleet': '47', 'heavysleet': '48', 'lightsnow': '49', 'heavysnow': '50'
        };

        function getIconUrl(symbolCode) {
            return iconBaseUrl + (symbolToId[symbolCode] || '04') + '.svg';
        }

        function getWindArrow(degrees) {
            return ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'][Math.round(degrees / 45) % 8];
        }

        function getTempClass(temp) {
            if (temp < -5) return 'temp-freezing';
            if (temp < 3) return 'temp-cold';
            if (temp < 10) return 'temp-cool';
            if (temp < 17) return 'temp-mild';
            if (temp < 24) return 'temp-warm';
            return 'temp-hot';
        }

        function formatTime(isoString) {
            var d = new Date(isoString);
            return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();
        }

        // Calculate sunrise/sunset (simplified algorithm for Lier area)
        function calculateSunTimes(lat, lon, date) {
            var radians = Math.PI / 180;
            var degrees = 180 / Math.PI;

            var dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
            var declination = -23.45 * Math.cos(radians * (360 / 365) * (dayOfYear + 10));

            var latRad = lat * radians;
            var decRad = declination * radians;

            var hourAngle = degrees * Math.acos(
                (Math.sin(-0.833 * radians) - Math.sin(latRad) * Math.sin(decRad)) /
                (Math.cos(latRad) * Math.cos(decRad))
            );

            var solarNoon = 12 - (lon / 15) + (date.getTimezoneOffset() / 60);
            var sunrise = solarNoon - (hourAngle / 15);
            var sunset = solarNoon + (hourAngle / 15);

            function toTimeString(hours) {
                var h = Math.floor(hours);
                var m = Math.round((hours - h) * 60);
                if (m === 60) { h++; m = 0; }
                return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
            }

            return {
                sunrise: toTimeString(sunrise),
                sunset: toTimeString(sunset)
            };
        }

        function updateSunTimes() {
            var times = calculateSunTimes(59.79, 10.25, new Date());
            document.getElementById('sunrise').textContent = times.sunrise;
            document.getElementById('sunset').textContent = times.sunset;
        }

        function fetchWeather(locationKey, callback) {
            var loc = locations[locationKey];
            var xhr = new XMLHttpRequest();
            xhr.open('GET', workerUrl + '?lat=' + loc.lat + '&lon=' + loc.lon, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try { callback(null, JSON.parse(xhr.responseText)); }
                        catch (e) { callback(e, null); }
                    } else { callback(new Error('HTTP ' + xhr.status), null); }
                }
            };
            xhr.send();
        }

        function renderWeatherCard(locationKey, data) {
            var card = document.querySelector('[data-location="' + locationKey + '"]');
            var loc = locations[locationKey];

            if (!data) {
                card.innerHTML = '<div class="current-section"><div class="location-name">' + loc.name + '</div><div class="error-msg">Ingen data</div></div>';
                return;
            }

            try {
                var ts = data.properties.timeseries;
                var current = ts[0];
                var details = current.data.instant.details;
                var next1h = current.data.next_1_hours;

                var temp = Math.round(details.air_temperature);
                var wind = details.wind_speed.toFixed(1);
                var windDir = details.wind_from_direction;
                var symbol = (next1h && next1h.summary) ? next1h.summary.symbol_code : 'fair_day';

                var now = new Date();
                var forecastHTML = '';
                var hours = [1, 2, 3, 4, 5, 6, 7, 8];

                for (var i = 0; i < hours.length; i++) {
                    var target = new Date(now.getTime() + hours[i] * 3600000);
                    var closest = ts[0], minDiff = Infinity;

                    for (var j = 0; j < ts.length; j++) {
                        var diff = Math.abs(new Date(ts[j].time) - target);
                        if (diff < minDiff) { minDiff = diff; closest = ts[j]; }
                    }

                    var fd = closest.data.instant.details;
                    var fn = closest.data.next_1_hours || closest.data.next_6_hours;
                    var fTemp = Math.round(fd.air_temperature);
                    var fSym = (fn && fn.summary) ? fn.summary.symbol_code : 'fair_day';
                    var fPrec = (fn && fn.details) ? fn.details.precipitation_amount : 0;

                    forecastHTML += '<div class="forecast-item">' +
                        '<span class="forecast-time">' + formatTime(closest.time) + '</span>' +
                        '<span class="forecast-icon"><img src="' + getIconUrl(fSym) + '" alt=""></span>' +
                        '<span class="forecast-temp ' + getTempClass(fTemp) + '">' + fTemp + '°</span>' +
                        '<span class="forecast-precip">' + fPrec.toFixed(1) + 'mm</span>' +
                        '</div>';
                }

                card.innerHTML = '<div class="current-section">' +
                    '<div class="location-name">' + loc.name + '</div>' +
                    '<div class="current-main">' +
                        '<span class="weather-icon"><img src="' + getIconUrl(symbol) + '" alt=""></span>' +
                        '<div class="current-info">' +
                            '<span class="current-temp ' + getTempClass(temp) + '">' + temp + '<span class="unit">°</span></span>' +
                            '<span class="current-detail">' + getWindArrow(windDir) + ' ' + wind + ' m/s</span>' +
                        '</div>' +
                    '</div>' +
                    '</div>' +
                    '<div class="forecast-section">' + forecastHTML + '</div>' +
                    '<span class="attribution">yr.no</span>';

            } catch (e) {
                card.innerHTML = '<div class="current-section"><div class="location-name">' + loc.name + '</div><div class="error-msg">Feil</div></div>';
            }
        }

        function initWeather() {
            updateSunTimes();
            ['lierbyen', 'lierstranda', 'tranby', 'sylling'].forEach(function(key) {
                fetchWeather(key, function(err, data) { renderWeatherCard(key, err ? null : data); });
            });
        }

        initWeather();
        setInterval(initWeather, 600000);
    </script>
</body>
</html>
